<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Scrapper App</title>

    <!-- Bootstrap correctamente cargado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <!-- Logo -->
    <a class="navbar-brand" href="/">
        <img src="{{ url_for('static', filename='logo.png') }}" width="30" class="me-2">
        ScrapperApp
    </a>

    <!-- Menú -->
    <div class="navbar-nav">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/scrapper">Scrapper</a>
        <a class="nav-link" href="/config">Configuration</a>
    </div>

    <!-- Barra de búsqueda -->
    <form class="d-flex ms-auto" action="/search" method="POST">
        <input class="form-control me-2" name="query" type="search" placeholder="Search">
        <button class="btn btn-success">Search</button>
    </form>

  </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
